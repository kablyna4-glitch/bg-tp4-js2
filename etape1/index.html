<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TP4 - Etape 1 : Tableau Statique</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Conteneur principal avec l'identifiant table_container -->
    <div id="table_container">
        <h2>Liste des Personnes</h2>
        <!-- Tableau HTML statique -->
        <table>
            <thead>
                <tr>
                    <th class="col_number">N°</th>
                    <th class="col_text">Nom</th>
                    <th class="col_text">Prénom</th>
                    <th class="col_text">Points</th>
                    <th class="col_chkbox">Sélect</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="col_number">1</td>
                    <td class="col_text">nom1</td>
                    <td class="col_text">prenom1</td>
                    <td class="col_text">5</td>
                    <td class="col_chkbox"><input type="checkbox"/></td>
                </tr>
                <tr>
                    <td class="col_number">2</td>
                    <td class="col_text">nom2</td>
                    <td class="col_text">prenom2</td>
                    <td class="col_text">10</td>
                    <td class="col_chkbox"><input type="checkbox"/></td>
                </tr>
                <tr>
                    <td class="col_number">3</td>
                    <td class="col_text">nom3</td>
                    <td class="col_text">prenom3</td>
                    <td class="col_text">15</td>
                    <td class="col_chkbox"><input type="checkbox"/></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
