<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TP4 - Etape 5 : Champs de saisie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="table_container">

        <h2>Liste des Personnes</h2>

        <!-- Formulaire de saisie -->
        <div id="formulaire">
            <label>Nom :&nbsp;
                <input type="text" id="input_nom" placeholder="Nom"/>
            </label>

            <label>Prénom :&nbsp;
                <input type="text" id="input_prenom" placeholder="Prénom"/>
            </label>

            <label>Points :&nbsp;
                <input type="number" id="input_points" placeholder="0"/>
            </label>

            <!-- onclick appelle doNewData() — événement onclick — slide 29 -->
            <button class="btn-add" onclick="doNewData()">Ajouter</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th class="col_number">N°</th>
                    <th class="col_text">Nom</th>
                    <th class="col_text">Prénom</th>
                    <th class="col_text">Points</th>
                    <th class="col_chkbox">Sélect</th>
                </tr>
            </thead>

            <tbody id="table_body">
                <!-- Les lignes seront ajoutées automatiquement par JavaScript -->
            </tbody>
        </table>

        <!-- Espace résumé mis à jour dynamiquement par JS -->
        <div id="resume">
            <span id="nb_lignes">0 ligne(s)</span>
            &nbsp;|&nbsp;
            <span id="total_pts">Total point(s) = 0</span>
        </div>

        <div id="container_btn">
            <!-- Bouton pour afficher le tableau persons dans la console -->
            <!-- Événement onclick : slide 29 -->
            <button class="btn-consol" onclick="consoleTableau()">Console Tableau</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
