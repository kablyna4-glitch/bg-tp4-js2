<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TP4 - Etape 4 : Espace Résumé</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="table_container">

        <h2>Liste des Personnes</h2>

        <table>
            <thead>
                <tr>
                    <th class="col_number">N°</th>
                    <th class="col_text">Nom</th>
                    <th class="col_text">Prénom</th>
                    <th class="col_text">Points</th>
                    <th class="col_chkbox">Sélect</th>
                </tr>
            </thead>

            <tbody id="table_body">
                <!-- Les lignes seront ajoutées automatiquement par JavaScript -->
            </tbody>
        </table>

        <!-- Espace résumé mis à jour dynamiquement par JS -->
        <div id="container_summary">
            <p id="p1">0 ligne(s)</p>
            <p id="p2"></p>
            <p id="p3">Total point(s) = 0</p>
        </div>

        <!-- Au clic, appelle doInsert avec des données statiques -->
        <!-- Événement onclick : slide 29 -->
        <button onclick="doInsert('nom', 'prenom', 10)">Ajouter</button>

        <!-- Bouton pour afficher le tableau persons dans la console -->
        <!-- Événement onclick : slide 29 -->
        <button onclick="consoleTableau()">Console Tableau</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
